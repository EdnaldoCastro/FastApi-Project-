<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="container">
        <form id="form-login" class="form-class">
            <h1>Faça o seu Login</h1>

            <div class="input-box">
                <input id="email" type="email" class="input" placeholder="Digite o seu E-mail" required>
            </div>
                
            <div class="input-box">
                <input id="senha" type="password" class="input" placeholder="Digite a sua senha" required>
            </div>
                <button type="submit" class="button">Entrar</button>
            
            
        </form>
        <p id="mensagem" class="msg"></p>
    </div>
       
    <script src="login.js"></script>
</body>
</html>
